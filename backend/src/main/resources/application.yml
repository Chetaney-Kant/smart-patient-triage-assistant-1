server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: healthcare-triage-assistant
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2} # Default to embedded H2 for zero-friction local run; use postgres for production
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:insert_mail_id}
    password: ${MAIL_PASSWORD:vjhdcxyautxzwlox}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: false
          timeout: 5000
          connectiontimeout: 5000
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:HealthcareTriageSecretKeyMustBeAtLeast256BitsLongForHS256AlgorithmSecurity2026}
    expiration-ms: 86400000 # 24 hours
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
  otp:
    expiration-minutes: 10
    length: 6
  ai:
    enabled: ${AI_ENABLED:true} # AI Kill Switch
    provider: ${AI_PROVIDER:fallback} # gemini, mock, fallback
    api-key: ${GEMINI_API_KEY:${AI_API_KEY:}}
    model: ${AI_MODEL:gemini-1.5-flash}
    timeout-ms: 8000
    prompt-version: v1.0.0-triage-safe
  safety:
    rule-version: v1.0.0-clinical-core
    emergency-override-enabled: true
    contradiction-detection-enabled: true
  emergency:
    default-region: IN
    simulated-sms-enabled: true
    simulated-email-enabled: true
    helpline-number: "112"
    ambulance-number: "108"
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
